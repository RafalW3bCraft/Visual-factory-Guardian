[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-factory-guardian"
version = "0.1.0"
description = "Evidence-driven industrial anomaly detection — computer vision and telemetry backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RafalW3bCraft" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=2",
  "pandas>=2",
  "pillow>=10",
  "opencv-python-headless>=4.10",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "rich>=13",
]
amd = [
  # Pin torch to the version matched with the team's ROCm install.
  # See docs/AMD_SETUP.md / docs/AMD_VERIFICATION_R1.md.
  "torch",
  "anomalib",
]

[project.scripts]
vfg-server = "backend.api.server:main"
vfg-demo = "scripts.run_demo:main"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]